services:

  redis:
  image: redis:7-alpine
  container_name: redis
  ports:
    - "6379:6379" 
  command: ["redis-server", "--requirepass", "yourpassword"]
  volumes:
    - redis_data:/data

mongodb:
  image: mongo:6.0
  container_name: mongodb
  ports:
    - "27017:27017"
  environment:
    MONGO_INITDB_ROOT_DATABASE: root
  volumes:
    - mongo_data:/data/db